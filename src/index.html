<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><%= htmlWebpackPlugin.options.title %></title>

    <!-- jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
          crossorigin="anonymous">

    <!-- https://www.daterangepicker.com/ -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css"/>

    <!-- plotly -->
    <script src="https://cdn.plot.ly/plotly-2.12.1.min.js"></script>
</head>
<body>
<div id="forecastViz_row" class="row">
    <!-- the div passed to predtimechart initialize(), which populates all DOM elements -->
</div>
<script type="module">
    import App from './predtimechart.bundle.js';  // hard-coded from webpack.config.cjs `output.filename`
    document.predtimechart = App;  // for debugging

    const covid19ForecastsVizTestOptions = {
        "available_as_ofs": {
            "week_ahead_incident_deaths": ["2022-01-22", "2022-01-29"],
            "day_ahead_incident_hospitalizations": ["2022-01-22", "2022-01-29"]
        },
        "current_date": "2022-01-29",
        "disclaimer": "Most forecasts have failed to reliably predict rapid changes in the trends of reported cases and hospitalizations. Due to this limitation, they should not be relied upon for decisions about the possibility or timing of rapid changes in trends.",
        "initial_as_of": "2022-01-29",
        "initial_checked_models": ["COVIDhub-baseline", "COVIDhub-ensemble"],
        "initial_interval": "95%",
        "initial_target_var": "week_ahead_incident_deaths",
        "initial_task_ids": {"scenario_id": "1", "location": "48"},
        "initial_xaxis_range": ["2022-02-01", "2022-02-15"],
        "initial_yaxis_range": null,
        "intervals": ["0%", "50%", "80%", "95%"],
        "models": ["COVIDhub-ensemble", "COVIDhub-baseline", "Empty-model"],
        "model_urls": {
            "COVIDhub-ensemble": "https://github.com/CDCgov/covid19-forecast-hub/blob/main/model-metadata/CovidHub-ensemble.yaml",
            "COVIDhub-baseline": "https://github.com/CDCgov/covid19-forecast-hub/blob/main/model-metadata/CovidHub-baseline.yaml",
            "Empty-model": "https://example.com/Empty-model"},
        "target_variables": [
            {
                "value": "week_ahead_incident_deaths",
                "text": "week ahead incident deaths",
                "plot_text": "week ahead incident deaths"
            },
            {
                "value": "day_ahead_incident_hospitalizations",
                "text": "day ahead incident hospitalizations",
                "plot_text": "day ahead incident hospitalizations"
            }],
        "task_ids": {
            "week_ahead_incident_deaths": {
                "scenario_id": [{"value": "1", "text": "scenario 1"}, {"value": "2", "text": "scenario 2"}],
                "location": [{"value": "48", "text": "Texas"}, {"value": "US", "text": "US"}]
            },
            "day_ahead_incident_hospitalizations": {
                "scenario_id": [{"value": "1b", "text": "scenario 1b"}, {"value": "2b", "text": "scenario 2b"}],
                "location": [{"value": "25", "text": "Massachusetts"}, {"value": "15", "text": "Hawaii"}]
            }
        },
    };

    // The real Zoltar truth for this demo's two reference dates is only the six/seven weeks starting 2021-12-18,
    // which all fall inside one season. This synthesizes weekly (Saturday) truth back through August 2019 so that
    // the plot spans three seasons and the gray historical season curves have something to show. The real values
    // are kept for the weeks Zoltar covers so that they still line up with the hard-coded forecasts.
    function _multiSeasonTruth(referenceDate) {
        const realValues = {
            '2021-12-18': 478.0, '2021-12-25': 266.0, '2022-01-01': 422.0, '2022-01-08': 717.0,
            '2022-01-15': 623.0, '2022-01-22': 971.0, '2022-01-29': 1212.0
        };
        const seasonAmplitudes = {2019: 750, 2020: 1450, 2021: 1050};  // keyed by season start year
        const date = [];
        const y = [];
        for (const day = new Date(2019, 7, 3); ; day.setDate(day.getDate() + 7)) {  // 2019-08-03, a Saturday
            const dateStr = [String(day.getFullYear()),
                String(day.getMonth() + 1).padStart(2, '0'),
                String(day.getDate()).padStart(2, '0')].join('-');
            if (dateStr > referenceDate) {  // ok to compare 'YYYY-MM-DD' as strings
                break;
            }

            date.push(dateStr);
            if (dateStr in realValues) {
                y.push(realValues[dateStr]);
                continue;
            }

            // a flu-like winter bump: a gaussian peaking ~153 days into the season, i.e., around New Year's Day
            const startYear = day.getMonth() >= 7 ? day.getFullYear() : day.getFullYear() - 1;
            const daysIntoSeason = Math.round((day - new Date(startYear, 7, 1)) / (1000 * 60 * 60 * 24));
            const amplitude = seasonAmplitudes[startYear] === undefined ? 900 : seasonAmplitudes[startYear];
            y.push(Math.round(80 + amplitude * Math.exp(-Math.pow(daysIntoSeason - 153, 2) / (2 * 35 * 35))));
        }
        return {"date": date, "y": y};
    }


    // a simple fetchData() that hard-codes truth and forecast data for two reference_dates
    function _fetchData(isForecast, targetKey, taskIDs, referenceDate) {
        console.debug('_fetchData():', isForecast, targetKey, taskIDs, referenceDate);
        const isForecastToRefDateToData = {
            true: {
                // https://zoltardata.com/api/project/316/viz-data/?is_forecast=true&target_key=week_ahead_incident_deaths&unit_abbrev=48&reference_date=2022-01-22 :
                '2022-01-22': {
                    "COVIDhub-baseline": {
                        "target_end_date": ["2022-01-29", "2022-02-05"],
                        "q0.025": [349.675, 210.819212192122],
                        "q0.1": [637.5, 553.2],
                        "q0.25": [855.75, 766.364243642436],
                        "q0.5": [971, 971],
                        "q0.75": [1086.25, 1175.66223912239],
                        "q0.9": [1304.5, 1418.5],
                        "q0.975": [1592.325, 1732.05851683517]
                    },
                    "COVIDhub-ensemble": {
                        "target_end_date": ["2022-01-29", "2022-02-05"],
                        "q0.025": [737, 774],
                        "q0.1": [830, 900],
                        "q0.25": [898, 993],
                        "q0.5": [1026, 1181],
                        "q0.75": [1158, 1354],
                        "q0.9": [1290, 1570],
                        "q0.975": [1455, 1826]
                    }
                },

                // https://zoltardata.com/api/project/316/viz-data/?is_forecast=true&target_key=week_ahead_incident_deaths&unit_abbrev=48&reference_date=2022-01-29 :
                '2022-01-29': {
                    "COVIDhub-baseline": {
                        "target_end_date": ["2022-02-05", "2022-02-12"],
                        "q0.025": [590.675, 446.981771067711],
                        "q0.1": [875.5, 789.5],
                        "q0.25": [1089.25, 1003.57023320233],
                        "q0.5": [1212, 1212],
                        "q0.75": [1334.75, 1421.13823138231],
                        "q0.9": [1548.9, 1660.2],
                        "q0.975": [1833.325, 1973.59632346323]
                    },
                    "COVIDhub-ensemble": {
                        "target_end_date": ["2022-02-05", "2022-02-12"],
                        "q0.025": [738, 801],
                        "q0.1": [990, 1030],
                        "q0.25": [1111, 1152],
                        "q0.5": [1198, 1321],
                        "q0.75": [1387, 1494],
                        "q0.9": [1560, 1700],
                        "q0.975": [1727, 1944]
                    }
                },
            },
            false: {
                '2022-01-22': _multiSeasonTruth('2022-01-22'),
                '2022-01-29': _multiSeasonTruth('2022-01-29'),
            }
        }

        // return data as a Promise<Response>
        const data = isForecastToRefDateToData[isForecast][referenceDate];
        if (data === undefined) {
            throw `no data found for inputs: isForecast=${isForecast}, referenceDate=${referenceDate}`
        }

        return new Promise((resolve, reject) => {
            resolve(new Response(JSON.stringify(data)));
        });
    }

    // componentDiv, _fetchData, isIndicateRedraw, options:
    App.initialize('forecastViz_row', _fetchData, false, covid19ForecastsVizTestOptions);
</script>
</body>
</html>
